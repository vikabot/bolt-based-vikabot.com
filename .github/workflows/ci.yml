name: CI - Build & Test

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ['3.1', '3.2']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better caching

      - name: Setup Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true  # runs 'bundle install' and caches installed gems

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Run HTMLProofer
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/" \
            --allow-hash-href \
            --ignore-files "/ai-desktop-products.html/" \
            --swap-urls "^/bolt-based-vikabot.com:" \
            --only-4xx

      - name: Lint JavaScript
        run: npm run lint:js
        continue-on-error: true  # Don't fail build on linting warnings initially

      - name: Lint Markdown
        run: npm run lint:md
        continue-on-error: true

      - name: Spell check
        run: npm run spellcheck
        continue-on-error: true

      - name: Check for broken links (external)
        if: github.event_name == 'pull_request'
        run: |
          bundle exec htmlproofer ./_site \
            --external-only \
            --ignore-urls "/linkedin.com/,/twitter.com/,/facebook.com/" \
            --http-status-ignore "999,403,429" \
            --typhoeus-config '{"timeout":30,"connecttimeout":10}' \
            --only-4xx
        continue-on-error: true  # External links may be rate-limited

      - name: Upload build artifacts
        if: matrix.ruby-version == '3.2'
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site/
          retention-days: 7

      - name: Test site navigation
        if: matrix.ruby-version == '3.2'
        run: |
          echo "Testing critical paths..."
          test -f _site/index.html
          test -f _site/products/index.html
          test -f _site/services/index.html
          test -f _site/contact/index.html
          test -f _site/about/index.html
          echo "✅ All critical pages exist"
