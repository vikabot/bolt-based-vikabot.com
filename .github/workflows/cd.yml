name: CD - Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual deployment

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Validate build
        run: |
          echo "Checking build output..."
          ls -la _site/
          test -f _site/index.html || (echo "❌ index.html not found" && exit 1)
          test -f _site/sitemap.xml || (echo "⚠️  sitemap.xml not found" && exit 0)
          echo "✅ Build validation passed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deployment-check:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for deployment to propagate
        run: sleep 30

      - name: Check site is accessible
        run: |
          echo "Testing site availability..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://www.vikabot.com/ || echo "000")
          if [ "$response" = "200" ] || [ "$response" = "403" ]; then
            echo "✅ Site is accessible (HTTP $response)"
          else
            echo "⚠️  Site returned HTTP $response"
            exit 1
          fi

      - name: Validate HTTPS
        run: |
          echo "Checking HTTPS configuration..."
          curl -sI https://www.vikabot.com/ | grep -i "strict-transport-security" || echo "⚠️  HSTS header not found"
          echo "✅ HTTPS check completed"
