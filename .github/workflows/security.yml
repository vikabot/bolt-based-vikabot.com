name: Security Scanning

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          gem install bundler-audit
          npm ci

      - name: Run Bundler Audit (Ruby dependencies)
        run: |
          bundle audit check --update
        continue-on-error: true

      - name: Run npm audit (Node dependencies)
        run: |
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          echo "Checking Gemfile.lock for vulnerabilities..."
          bundle audit check || echo "⚠️  Vulnerabilities found in Ruby dependencies"

          echo "Checking package-lock.json for vulnerabilities..."
          npm audit --audit-level=high || echo "⚠️  Vulnerabilities found in Node dependencies"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  security-headers:
    name: Check Security Headers
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check security headers
        run: |
          echo "Checking security headers on production site..."

          # Check for HTTPS
          curl -sI https://www.vikabot.com/ | grep -i "HTTP" || true

          # Check for security headers (may not be present on all hosting)
          echo "Checking for security headers..."
          curl -sI https://www.vikabot.com/ | grep -i "strict-transport-security" || echo "⚠️  HSTS not found"
          curl -sI https://www.vikabot.com/ | grep -i "x-content-type-options" || echo "⚠️  X-Content-Type-Options not found"
          curl -sI https://www.vikabot.com/ | grep -i "x-frame-options" || echo "⚠️  X-Frame-Options not found"

          echo "✅ Security headers check completed"
